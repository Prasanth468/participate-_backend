# ── Server ────────────────────────────────────────────────
# Railway injects $PORT — must use ${PORT} to avoid 502/403 errors
server.port=${PORT:8080}

# ── MySQL DataSource ──────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/participatehere}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ───────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:your-secret-key-here}
app.jwt.expiration-ms=${JWT_EXPIRATION:300000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ── Logging ───────────────────────────────────────────────
logging.level.com.participatehere=DEBUG

# ── Mail Configuration ────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Groq API ──────────────────────────────────────────────
groq.api.key=${GROQ_API_KEY:your-groq-api-key}

# ── Actuator (Railway health checks) ──────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
